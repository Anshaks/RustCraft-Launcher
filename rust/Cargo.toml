[package]
name = "rustcraft_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "rustcraft_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
